{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}
{% block content %}
<section class="container text-center error-page">
  <div class="error-code">{{ code }}</div>
  <h2>{{ title }}</h2>
  <p class="text-muted">{{ message }}</p>
  <a href="{{ url_for('index') }}" class="btn btn-teal btn-lg mt-2">Back to home</a>
</section>
{% endblock %}
